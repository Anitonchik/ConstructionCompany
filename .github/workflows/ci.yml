  name: Java CI with Gradle

  on:
    push:
    pull_request:

  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4
        # spotlessCheck
        - name: Run Spotless Check (Code Style)
          run: ./gradlew spotlessCheck

        - name: Run Checkstyle
          run: ./gradlew checkstyleMain checkstyleTest
        - name: Run SpotBugs
          run: ./gradlew spotbugsMain
        - name: Upload static analysis
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: static-analysis-reports
            path: |
              build/reports/checkstyle/
              build/reports/spotbugs/

    commitlint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - uses: wagoid/commitlint-github-action@v6

    test:
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4
        - name: Run tests with coverage
          run: ./gradlew test jacocoTestReport
        - name: Upload coverage report
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-report
            path: build/reports/jacoco/test/html/

    build:
      runs-on: ubuntu-latest
      needs: [test]
      permissions:
        contents: read

      steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: construction-company-app-jar
          path: build/libs/*.jar

    deploy:
      runs-on: ubuntu-latest
      needs: build
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Download build artifact
          uses: actions/download-artifact@v4
          with:
            name: construction-company-app-jar
            path: build/libs/

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set lowercase repository name
          id: repo
          run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ghcr.io/${{ steps.repo.outputs.name }}:latest

    pipline-metrics:
      runs-on: ubuntu-latest
      if: always()
      needs: [ lint, test, build ]
      permissions:
        actions: read
      steps:
        - name: CI success rate (last 20 runs)
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            success=$(gh run list \
              --workflow="Java CI with Gradle" \
              --limit 20 \
              --json conclusion \
              --jq '[.[] | select(.conclusion == "success")] | length')

            total=20
            rate=$(( success * 100 / total ))

            echo "## CI Success Rate" >> $GITHUB_STEP_SUMMARY
            echo "**${rate}%** (${success}/${total} successful runs)" >> $GITHUB_STEP_SUMMARY