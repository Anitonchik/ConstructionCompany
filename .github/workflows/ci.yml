  name: Java CI with Gradle

  on:
    push:
    pull_request:

  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4
        # spotlessCheck
        - name: Run Spotless Check (Code Style)
          run: ./gradlew spotlessCheck

        - name: Run Checkstyle
          run: ./gradlew checkstyleMain checkstyleTest
        - name: Run SpotBugs
          run: ./gradlew spotbugsMain
        - name: Upload static analysis
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: static-analysis-reports
            path: |
              build/reports/checkstyle/
              build/reports/spotbugs/

    commitlint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - uses: wagoid/commitlint-github-action@v6

    test:
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4
        - name: Run tests with coverage
          run: ./gradlew test jacocoTestReport
        - name: Upload coverage report
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-report
            path: build/reports/jacoco/test/html/

    build:
      runs-on: ubuntu-latest
      needs: [test]
      permissions:
        contents: read

      steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: construction-company-app-jar
          path: build/libs/*.jar

    deploy:
      runs-on: ubuntu-latest
      needs: build
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Download build artifact
          uses: actions/download-artifact@v4
          with:
            name: construction-company-app-jar
            path: build/libs/

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set lowercase repository name
          id: repo
          run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ghcr.io/${{ steps.repo.outputs.name }}:latest

    pipline-metrics:
        name: Calculate CI Stability Metric
        runs-on: ubuntu-latest
        if: always()
        needs: [ deploy ]

        steps:
          - name: Calculate Pipeline Success Rate
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              # Обращаемся к workflow напрямую по имени файла ci.yml
              RUNS_DATA=$(gh api repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=20)

              TOTAL_RUNS=$(echo "$RUNS_DATA" | jq '.workflow_runs | length')
              SUCCESS_RUNS=$(echo "$RUNS_DATA" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
              FAILED_RUNS=$(echo "$RUNS_DATA" | jq '[.workflow_runs[] | select(.conclusion == "failure")] | length')
              OTHER_RUNS=$(echo "$RUNS_DATA" | jq '[.workflow_runs[] | select(.conclusion != "success" and .conclusion != "failure")] | length')

              if [ "$TOTAL_RUNS" -gt 0 ]; then
                SUCCESS_RATE=$(awk "BEGIN {printf \"%.2f\", ($SUCCESS_RUNS / $TOTAL_RUNS) * 100}")
              else
                SUCCESS_RATE="0.00"
              fi

              echo "### Метрика стабильности CI" >> $GITHUB_STEP_SUMMARY
              echo "- **Workflow**: \`ci.yml\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Всего последних запусков**: $TOTAL_RUNS" >> $GITHUB_STEP_SUMMARY
              echo "- **Успешных**: $SUCCESS_RUNS" >> $GITHUB_STEP_SUMMARY
              echo "- **Упавших с ошибкой**: $FAILED_RUNS" >> $GITHUB_STEP_SUMMARY
              echo "- **Отмененных/Пропущенных**: $OTHER_RUNS" >> $GITHUB_STEP_SUMMARY
              echo "- **Доля успешных запусков**: **${SUCCESS_RATE}%**" >> $GITHUB_STEP_SUMMARY

              echo "metric_name=ci_stability_rate" > ci-metrics.txt
              echo "workflow=ci.yml" >> ci-metrics.txt
              echo "success_rate_percent=${SUCCESS_RATE}" >> ci-metrics.txt
              echo "total_runs=${TOTAL_RUNS}" >> ci-metrics.txt
              echo "success_runs=${SUCCESS_RUNS}" >> ci-metrics.txt
              echo "failed_runs=${FAILED_RUNS}" >> ci-metrics.txt
              echo "other_runs=${OTHER_RUNS}" >> ci-metrics.txt
              echo "branch=${{ github.ref_name }}" >> ci-metrics.txt

          - name: Upload CI Metrics Artifact
            uses: actions/upload-artifact@v4
            with:
              name: ci-stability-metrics-report
              path: ci-metrics.txt